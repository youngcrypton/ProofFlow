[build]
# Keep this service on the API Dockerfile; Railway Config as Code overrides dashboard defaults.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "bun run apps/api/src/server.ts"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
